<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafo Manual</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; display: flex; gap: 30px; background: #f4f7f6;}
        .panel { background: white; border: 1px solid #ccc; padding: 20px; border-radius: 8px; flex: 1; }
        .btn { padding: 10px 15px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold;}
        .btn-add { background: #28a745; color: white; width: 100%; margin-top: 15px;}
        ul { list-style-type: none; padding: 0; }
        li { background: #f4f4f4; margin: 5px 0; padding: 10px; border-radius: 5px; border-left: 4px solid #007bff;}
        #canvas-grafo { width: 100%; height: 400px; border: 1px solid lightgray; background-color: #fafafa; margin-top: 20px;}
        select, input { padding: 8px; width: 100%; margin-bottom: 10px; box-sizing: border-box;}
    </style>
</head>
<body>
    <div class="panel">
        <h2>Vista Previa del Grafo</h2>
        <div id="canvas-grafo"></div>
        <br>
        
        <!-- AQUÍ ESTÁ EL FORMULARIO CORREGIDO -->
        <form action="/algoritmo" method="POST" onsubmit="prepararEnvio()">
            <!-- Usamos un input hidden para guardar la matriz generada en JS -->
            <input type="hidden" name="matriz" id="inputMatriz">
            <input type="hidden" name="letras" value='{{ letras | tojson }}'>
            
            <button type="submit" id="btnGenerar" class="btn" disabled style="width: 100%; background: #007bff; color: white; font-size: 16px;">
                Generar y Continuar
            </button>
        </form>
        <p id="mensajeError" style="color: red; font-size: 14px; text-align: center;">* Conecta todos los nodos para continuar.</p>
    </div>

    <div class="panel">
        <h2>Definir Aristas</h2>
        <p>Nodos disponibles: <strong>{{ letras | join(', ') }}</strong></p>
        
        <label for="nodoA">Nodo A:</label>
        <select id="nodoA">
            {% for l in letras %}
                <option value="{{ loop.index0 }}">{{ l }}</option>
            {% endfor %}
        </select>
        
        <label for="nodoB">Nodo B:</label>
        <select id="nodoB">
            {% for l in letras %}
                <option value="{{ loop.index0 }}">{{ l }}</option>
            {% endfor %}
        </select>
        
        <label for="peso">Peso (Costo/Distancia):</label>
        <input type="number" id="peso" min="1" placeholder="Ej. 15">
        
        <button class="btn btn-add" onclick="agregarArista()">Agregar Arista</button>

        <h3>Lista de Aristas Ingresadas</h3>
        <ul id="listaAristas"></ul>
    </div>

    <script>
        const n = {{ n }};
        const letras = {{ letras | tojson }};
        
        // Crear matriz de costos vacía (llena de 0s)
        let matrizCostos = Array(n).fill(0).map(() => Array(n).fill(0));
        let aristasLocal = [];

        // Inicializar motor gráfico
        let nodes = new vis.DataSet();
        let edges = new vis.DataSet();

        for(let i = 0; i < n; i++){
            nodes.add({id: i, label: letras[i], shape: 'circle', color: '#ff5722', font: {color: 'white', size: 16}});
        }

        const container = document.getElementById('canvas-grafo');
        const network = new vis.Network(container, { nodes: nodes, edges: edges }, { physics: { stabilization: true } });

        function agregarArista() {
            let u = parseInt(document.getElementById('nodoA').value);
            let v = parseInt(document.getElementById('nodoB').value);
            let p = parseInt(document.getElementById('peso').value);

            if (isNaN(p) || p <= 0) {
                alert("Ingrese un peso válido mayor a 0.");
                return;
            }
            if (u === v) {
                alert("No se permiten bucles. Un nodo no puede conectarse consigo mismo.");
                return;
            }
            if (matrizCostos[u][v] > 0) {
                alert("Esta arista ya existe. No se permiten conexiones duplicadas.");
                return;
            }

            // Guardar arista en la matriz (simétrica porque es no dirigido)
            matrizCostos[u][v] = p;
            matrizCostos[v][u] = p;
            aristasLocal.push({u, v, peso: p});
            
            // Dibujar en el grafo
            edges.add({ from: u, to: v, label: String(p), font: {align: 'horizontal', size: 14}, width: 2 });
            
            actualizarLista();
            verificarConectividad();
        }

        function actualizarLista() {
            const ul = document.getElementById('listaAristas');
            ul.innerHTML = '';
            aristasLocal.forEach(a => {
                let li = document.createElement('li');
                li.innerHTML = `<strong>${letras[a.u]} &harr; ${letras[a.v]}</strong> (Peso: ${a.peso})`;
                ul.appendChild(li);
            });
        }

        function verificarConectividad() {
            // Recorrido DFS para saber si el grafo está conectado
            let visitados = new Set();
            let cola = [0];
            visitados.add(0);

            while(cola.length > 0) {
                let actual = cola.shift();
                for(let vecino = 0; vecino < n; vecino++) {
                    if(matrizCostos[actual][vecino] > 0 && !visitados.has(vecino)) {
                        visitados.add(vecino);
                        cola.push(vecino);
                    }
                }
            }

            const btn = document.getElementById('btnGenerar');
            const msj = document.getElementById('mensajeError');
            
            if(visitados.size === n) {
                btn.disabled = false;
                msj.style.display = 'none';
            } else {
                btn.disabled = true;
                msj.style.display = 'block';
            }
        }

        // Antes de enviar el formulario, convertimos la matriz a texto (JSON) para que Python la entienda
        function prepararEnvio() {
            document.getElementById('inputMatriz').value = JSON.stringify(matrizCostos);
        }
    </script>
</body>
</html>
