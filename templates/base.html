<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problema del Agente Viajero - TSP</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f111a; /* Fondo oscuro pro */
            color: #e2e8f0;
        }
        /* Barra de navegación superior estilo app de análisis */
        .navbar-custom {
            background-color: #1a1d2d;
            border-bottom: 1px solid #2d3748;
        }
        /* Tarjetas estilo panel oscuro (Dark Dashboard Card) */
        .card {
            background-color: #1a1d2d !important;
            border: 1px solid #2d3748 !important;
            border-radius: 12px;
            color: #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .form-control, .form-select {
            background-color: #10121b !important;
            border: 1px solid #3f4a63 !important;
            color: #ffffff !important;
        }
        .form-control:focus {
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
        }
        /* Textos y etiquetas adaptadas */
        .text-muted {
            color: #94a3b8 !important;
        }
        hr {
            border-color: #2d3748;
        }
    </style>
</head>
<body>

    <!-- Barra Superior Pro -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3 shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-light" href="/">
                <span class="text-indigo">⚡</span> TSP - Agente Viajero (Fuerza Bruta)
            </a>
            <div class="d-flex align-items-center">
                <span class="badge bg-secondary px-3 py-2">Matemática Computacional</span>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <main class="container-fluid px-4 my-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
